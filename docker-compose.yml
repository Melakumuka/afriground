# ============================================================================
# AfriGround — Docker Compose (Development)
# ============================================================================
version: "3.9"

services:
  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: afriground-postgres
    restart: unless-stopped
    ports:
      # Host port 5433: a native Postgres on the host often occupies 5432.
      - "5433:5432"
    environment:
      POSTGRES_DB: afriground
      POSTGRES_USER: afriground
      POSTGRES_PASSWORD: afriground_dev_password
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
      - ./apps/api/scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afriground"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: afriground-redis
    restart: unless-stopped
    ports:
      - "6379:6379"   # host access for Celery broker (celery_app.py)
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible Object Storage) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: afriground-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    environment:
      MINIO_ROOT_USER: afriground
      MINIO_ROOT_PASSWORD: afriground_minio_secret
    command: server /data --console-address ":9001"
    volumes:
      - .docker-data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MinIO Bucket Init ─────────────────────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: afriground-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 afriground afriground_minio_secret;
      mc mb --ignore-existing local/afriground-raw;
      mc mb --ignore-existing local/afriground-processed;
      mc mb --ignore-existing local/afriground-archive;
      echo 'Buckets created successfully';
      "

  # ── AfriGround API (Phase 3.3) ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: afriground-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://afriground:afriground_dev_password@postgres:5432/afriground
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: afriground_dev_secret
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-placeholder}
      API_CORS_ORIGINS: "*"
      AFRIGROUND_ORCHESTRATION_SIMULATE: "1"
    ports:
      - "8000:8000"

  # ── AfriGround Celery worker + beat (Phase 3.3) ────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.worker
    container_name: afriground-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AFRIGROUND_WORKER_URL: postgresql+asyncpg://afriground:afriground_dev_password@postgres:5432/afriground
      DATABASE_URL: postgresql+asyncpg://afriground:afriground_dev_password@postgres:5432/afriground
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      SECRET_KEY: afriground_dev_secret
      SUPABASE_URL: ${SUPABASE_URL:-https://placeholder.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-placeholder}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-placeholder}
      AFRIGROUND_ORCHESTRATION_SIMULATE: "1"
